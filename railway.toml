# Railway deployment. Uses the Dockerfile. Attach a Volume mounted at /app/data
# so SQLite + uploaded files persist across deploys.
[build]
  builder = "DOCKERFILE"
  dockerfilePath = "Dockerfile"

[deploy]
  startCommand = ""   # Dockerfile CMD handles seed + start
  healthcheckPath = "/api/health"
  healthcheckTimeout = 300
  restartPolicyType = "ON_FAILURE"
  restartPolicyMaxRetries = 3
